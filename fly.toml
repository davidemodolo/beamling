app = "beamling"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "20s"
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  APP_URL = "https://beamling.app"
  COOKIE_SECURE = "true"
  TRUSTED_PROXY_HOPS = "1"
  OIDC_ISSUER = "https://accounts.google.com"
  KMS_PROVIDER = "gcp"
  DATABASE_SSL = "true"
  DATABASE_SSL_REJECT_UNAUTHORIZED = "true"
  # Keep in-flight streams below the platform connection ceiling so health checks and
  # ordinary requests retain headroom.
  MAX_CONCURRENT_CHATS = "30"
  PLATFORM_CONNECTION_LIMIT = "50"
  DATABASE_POOL_MAX = "10"
  # Safe default: only invited addresses may create accounts. Set to "open" to launch publicly.
  SIGNUP_MODE = "allowlist"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 40
    hard_limit = 50

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

[deploy]
  release_command = "node scripts/migrate.mjs"
