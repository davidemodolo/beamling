services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: beamling
      POSTGRES_USER: beamling
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beamling}
    # Local development only: bound to loopback so the database is not reachable from the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - beamling-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beamling -d beamling"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "scripts/migrate.mjs"]
    environment:
      DATABASE_URL: postgres://beamling:${POSTGRES_PASSWORD:-beamling}@db:5432/beamling
      BEAMLING_FAKE_PROVIDERS: ${BEAMLING_FAKE_PROVIDERS:-0}
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://beamling:${POSTGRES_PASSWORD:-beamling}@db:5432/beamling
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:?Set CREDENTIAL_MASTER_KEY}
      CREDENTIAL_MASTER_KEY_ID: ${CREDENTIAL_MASTER_KEY_ID:-k1}
      CREDENTIAL_PREVIOUS_MASTER_KEYS: ${CREDENTIAL_PREVIOUS_MASTER_KEYS:-}
      # No default: a forgotten APP_URL must not silently run with localhost settings (non-Secure cookies).
      APP_URL: ${APP_URL:?Set APP_URL, e.g. http://localhost:3000 for a local run}
      PORT: "3000"
      # Empty unless set: the server then uses 1 locally, and refuses to start outside localhost.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-}
      MAX_CONCURRENT_CHATS: ${MAX_CONCURRENT_CHATS:-50}
      BEAMLING_FAKE_PROVIDERS: ${BEAMLING_FAKE_PROVIDERS:-0}
      BEAMLING_FAKE_DELAY_MS: ${BEAMLING_FAKE_DELAY_MS:-8}
      BRAVE_MIN_INTERVAL_MS: ${BRAVE_MIN_INTERVAL_MS:-1100}
    # Running answers get time to store their partial text on shutdown.
    stop_grace_period: 15s
    # Local only: bound to loopback. Without a reverse proxy, X-Forwarded-For comes from the client,
    # so do not publish this port to a network; put a TLS proxy in front instead.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  beamling-postgres:
