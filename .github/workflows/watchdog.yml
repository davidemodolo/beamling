name: Watchdog

on:
  schedule:
    # Liveness every 5 minutes. /api/live does not touch the database, so Neon can still scale to
    # zero; the full readiness check (database, schema, KMS) runs hourly and on manual dispatch.
    - cron: "*/5 * * * *"
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public liveness (and hourly readiness)
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_APP_URL || 'https://beamling.app' }}
          FULL_CHECK: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *' }}
        run: |
          curl --fail --silent --show-error --max-time 20 "$PUBLIC_URL/api/live" >/dev/null
          if [ "$FULL_CHECK" = "true" ]; then
            # A sleeping database or a cold instance can take a few seconds to answer.
            curl --fail --silent --show-error --max-time 30 "$PUBLIC_URL/api/health" >/dev/null
            curl --fail --silent --show-error --max-time 30 "$PUBLIC_URL/" >/dev/null
          fi
      - name: Notify operator
        if: failure()
        env:
          WEBHOOK: ${{ secrets.WATCHDOG_WEBHOOK_URL }}
          PUBLIC_URL: ${{ vars.PUBLIC_APP_URL || 'https://beamling.app' }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "No WATCHDOG_WEBHOOK_URL secret; relying on GitHub failure notifications."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 10 \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"Beamling watchdog failed for $PUBLIC_URL at $(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            "$WEBHOOK"
