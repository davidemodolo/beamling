<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0C0D">
<title>Offline · Beamling</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0C0C0D; color: #F4F1EA;
    font: 16px/1.5 system-ui, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  main { max-width: 22rem; display: grid; gap: 12px; justify-items: center; }
  img { width: 64px; height: 64px; }
  h1 { font-size: 20px; margin: 8px 0 0; }
  p { margin: 0; color: #A3A3A7; }
  a { color: #FFD98A; }
</style>
</head>
<body>
<main>
  <img src="/icon.svg" alt="">
  <h1>You are offline</h1>
  <p>Beamling needs a connection to answer. Check your network, then <a href="/">try again</a>.</p>
</main>
</body>
</html>
