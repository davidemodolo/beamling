# Billing kill switch. Triggered by every budget notification on the billing-guard Pub/Sub topic.
# When the month's cost reaches the budget, it detaches billing from every project on the billing
# account, the project hosting this workflow last, which stops all paid services. Re-enable
# billing on each project by hand afterwards. A message with "dryRun": true only lists the projects;
# one with "testProject" stops only that project (used to prove the stop on a throwaway project).
# Real budget notifications carry neither field.
main:
  params: [event]
  steps:
    - init:
        assign:
          - billingAccount: ${sys.get_env("BILLING_ACCOUNT")}
          - hostProject: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - data: ${json.decode(base64.decode(event.data.message.data))}
          - dryRun: ${default(map.get(data, "dryRun"), false)}
          - testProject: ${default(map.get(data, "testProject"), "")}
    - checkBudget:
        switch:
          - condition: ${not dryRun and data.costAmount < data.budgetAmount}
            return: '${"Under budget - " + string(data.costAmount) + " of " + string(data.budgetAmount)}'
    - listProjects:
        call: http.get
        args:
          url: ${"https://cloudbilling.googleapis.com/v1/billingAccounts/" + billingAccount + "/projects"}
          auth:
            type: OAuth2
        result: listing
    - collect:
        assign:
          - others: []
          - hostLinked: false
    - sortProjects:
        for:
          value: project
          in: ${default(map.get(listing.body, "projectBillingInfo"), [])}
          steps:
            - classify:
                switch:
                  - condition: ${not project.billingEnabled}
                    next: continue
                  - condition: ${project.projectId == hostProject}
                    steps:
                      - markHost:
                          assign:
                            - hostLinked: true
                  - condition: true
                    steps:
                      - addOther:
                          assign:
                            - others: ${list.concat(others, project.projectId)}
    - allProjects:
        assign:
          - targets: ${others}
    - addHost:
        switch:
          - condition: ${hostLinked}
            steps:
              - appendHost:
                  assign:
                    - targets: ${list.concat(targets, hostProject)}
    - limitToTest:
        switch:
          - condition: ${testProject != ""}
            steps:
              - onlyTest:
                  assign:
                    - targets: []
                    - hostLinked: false
              - checkTest:
                  for:
                    value: candidate
                    in: ${others}
                    steps:
                      - match:
                          switch:
                            - condition: ${candidate == testProject}
                              steps:
                                - keep:
                                    assign:
                                      - targets: ${list.concat([], candidate)}
              - useTest:
                  assign:
                    - others: ${targets}
    - reportDryRun:
        switch:
          - condition: ${dryRun}
            return:
              dryRun: true
              wouldDisable: ${targets}
    - announce:
        call: sys.log
        args:
          severity: ALERT
          json:
            message: Budget exceeded; disabling billing
            costAmount: ${data.costAmount}
            budgetAmount: ${data.budgetAmount}
            projects: ${targets}
    - startDisabling:
        assign:
          - failures: []
    # Every project is attempted even if an earlier one fails; the host goes last because
    # disabling its billing also stops this workflow.
    - disableAll:
        for:
          value: projectId
          in: ${targets}
          steps:
            - disable:
                call: unlinkBilling
                args:
                  projectId: ${projectId}
                result: disabled
            - recordFailure:
                switch:
                  - condition: ${not disabled}
                    steps:
                      - addFailure:
                          assign:
                            - failures: ${list.concat(failures, projectId)}
    - reportFailures:
        switch:
          - condition: ${len(failures) > 0}
            raise:
              message: Could not disable billing on some projects
              projects: ${failures}
    - done:
        return: Billing disabled

unlinkBilling:
  params: [projectId]
  steps:
    - unlink:
        try:
          call: http.put
          args:
            url: ${"https://cloudbilling.googleapis.com/v1/projects/" + projectId + "/billingInfo"}
            auth:
              type: OAuth2
            body:
              billingAccountName: ""
        # Retries transient errors (429, 5xx, connection failures) with backoff.
        retry: ${http.default_retry}
        except:
          as: e
          steps:
            - logFailure:
                call: sys.log
                args:
                  severity: ERROR
                  json:
                    message: Could not disable billing
                    project: ${projectId}
                    error: ${e}
            - failed:
                return: false
    - logSuccess:
        call: sys.log
        args:
          severity: ALERT
          json:
            message: Billing disabled
            project: ${projectId}
    - ok:
        return: true
