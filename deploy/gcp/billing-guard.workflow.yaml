# Billing kill switch. Triggered by every budget notification on the billing-guard Pub/Sub topic.
# When the month's cost reaches the budget, it detaches billing from every project on the billing
# account, the project hosting this workflow last, which stops all paid services. Re-enable
# billing on each project by hand afterwards. A message with "dryRun": true only lists the projects.
main:
  params: [event]
  steps:
    - init:
        assign:
          - billingAccount: ${sys.get_env("BILLING_ACCOUNT")}
          - hostProject: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - data: ${json.decode(base64.decode(event.data.message.data))}
          - dryRun: ${default(map.get(data, "dryRun"), false)}
    - checkBudget:
        switch:
          - condition: ${not dryRun and data.costAmount < data.budgetAmount}
            return: '${"Under budget - " + string(data.costAmount) + " of " + string(data.budgetAmount)}'
    - listProjects:
        call: http.get
        args:
          url: ${"https://cloudbilling.googleapis.com/v1/billingAccounts/" + billingAccount + "/projects"}
          auth:
            type: OAuth2
        result: listing
    - collect:
        assign:
          - others: []
          - hostLinked: false
    - sortProjects:
        for:
          value: project
          in: ${default(map.get(listing.body, "projectBillingInfo"), [])}
          steps:
            - classify:
                switch:
                  - condition: ${not project.billingEnabled}
                    next: continue
                  - condition: ${project.projectId == hostProject}
                    steps:
                      - markHost:
                          assign:
                            - hostLinked: true
                  - condition: true
                    steps:
                      - addOther:
                          assign:
                            - others: ${list.concat(others, project.projectId)}
    - allProjects:
        assign:
          - targets: ${others}
    - addHost:
        switch:
          - condition: ${hostLinked}
            steps:
              - appendHost:
                  assign:
                    - targets: ${list.concat(targets, hostProject)}
    - reportDryRun:
        switch:
          - condition: ${dryRun}
            return:
              dryRun: true
              wouldDisable: ${targets}
    - announce:
        call: sys.log
        args:
          severity: ALERT
          json:
            message: Budget exceeded; disabling billing
            costAmount: ${data.costAmount}
            budgetAmount: ${data.budgetAmount}
            projects: ${targets}
    - disableOthers:
        for:
          value: projectId
          in: ${others}
          steps:
            - disable:
                call: unlinkBilling
                args:
                  projectId: ${projectId}
    - disableHost:
        switch:
          - condition: ${hostLinked}
            steps:
              - unlinkHost:
                  call: unlinkBilling
                  args:
                    projectId: ${hostProject}
    - done:
        return: Billing disabled

unlinkBilling:
  params: [projectId]
  steps:
    - unlink:
        try:
          call: http.put
          args:
            url: ${"https://cloudbilling.googleapis.com/v1/projects/" + projectId + "/billingInfo"}
            auth:
              type: OAuth2
            body:
              billingAccountName: ""
        except:
          as: e
          steps:
            - logFailure:
                call: sys.log
                args:
                  severity: ERROR
                  json:
                    message: Could not disable billing
                    project: ${projectId}
                    error: ${e}
            - failed:
                return: false
    - logSuccess:
        call: sys.log
        args:
          severity: ALERT
          json:
            message: Billing disabled
            project: ${projectId}
    - ok:
        return: true
