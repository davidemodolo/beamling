packages:
  - "packages/*"
ignoredOptionalDependencies:
  - sharp
# Dependency build scripts are denied. esbuild ships its binary as an optional
# dependency and protobufjs only prints a version check.
allowBuilds:
  esbuild: false
  protobufjs: false
# Patched versions for two dev-only advisories, forced past their parents' ranges:
# minimatch >=7 <11.0.1 (via eslint) and esbuild <=0.24.2 (via drizzle-kit's @esbuild-kit loader).
# Drop each entry once the parent package ships a release that includes the fix.
overrides:
  "minimatch@>=7.0.0 <11.0.1": 11.0.5
  "@esbuild-kit/core-utils>esbuild": 0.25.12
# eslint-config-next's plugins (react, jsx-a11y, import) have not yet declared ESLint 10 in their
# peer range, even in their latest releases. Their rules were checked to run under ESLint 10.
# Drop an entry once the plugin's own peer range includes ESLint 10.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-react>eslint: "10"
    eslint-plugin-jsx-a11y>eslint: "10"
    eslint-plugin-import>eslint: "10"
